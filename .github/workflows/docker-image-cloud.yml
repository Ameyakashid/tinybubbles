name: Docker Image (cloud)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g., v0.6.3)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push-image:
    # Tiny Bubbles fork: releases are disabled until the project publishes builds.
    # Set repository variable ENABLE_RELEASE_WORKFLOWS=true to re-enable.
    if: vars.ENABLE_RELEASE_WORKFLOWS == 'true'
    uses: ./.github/workflows/docker-image-reusable.yml
    with:
      image_name: tinybubbles-cloud
      dockerfile: ./docker/cloud/Dockerfile
      tag: ${{ github.event.inputs.tag || '' }}
