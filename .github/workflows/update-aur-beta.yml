name: Update AUR Beta

on:
  workflow_call:
    inputs:
      tag:
        description: "RC or stable tag to prepare for tinybubbles-bin-beta (e.g., v1.0.5-rc.1 or v1.0.5)"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing RC or stable tag to prepare for tinybubbles-bin-beta"
        required: true
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: update-aur-beta-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  update-aur-beta:
    runs-on: ubuntu-latest
    name: Prepare tinybubbles-bin-beta proposal
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Resolve release version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          scripts/ci/resolve-release-version.sh "$INPUT_TAG" >> "$GITHUB_OUTPUT"

      - name: Validate beta release tag
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          # Stable tags are allowed too: every stable release also lands in the
          # beta channels so beta users never have to hop back to stay current.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "tinybubbles-bin-beta must be updated from an RC or stable tag like v1.0.5-rc.1 or v1.0.5; got: $TAG" >&2
            exit 1
          fi

      - name: Clone AUR beta repo read-only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf aur-tinybubbles-bin-beta
          git clone https://aur.archlinux.org/tinybubbles-bin-beta.git aur-tinybubbles-bin-beta

      - name: Generate beta PKGBUILD
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
            PKGVER="${BASH_REMATCH[1]}rc${BASH_REMATCH[2]}"
          else
            PKGVER="${VERSION//-/_}"
          fi
          export TAG VERSION PKGVER
          python3 - <<'PY'
          import os
          from pathlib import Path

          template = Path('aur/PKGBUILD-bin-beta.template').read_text(encoding='utf-8')
          text = (template
              .replace('__PKGVER__', os.environ['PKGVER'])
              .replace('__RELEASE_TAG__', os.environ['TAG'])
              .replace('__ASSET_VERSION__', os.environ['VERSION']))
          Path('aur-tinybubbles-bin-beta/PKGBUILD').write_text(text, encoding='utf-8')
          PY

      - name: Resolve release asset checksum
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          URL_DEB="https://github.com/${{ github.repository }}/releases/download/${TAG}/tinybubbles_${VERSION}_amd64.deb"
          URL_SUMS="https://github.com/${{ github.repository }}/releases/download/${TAG}/SHA256SUMS"
          ASSET_NAME="tinybubbles_${VERSION}_amd64.deb"
          echo "Waiting for release assets to become available..."
          for attempt in $(seq 1 10); do
            if curl -fsI "$URL_DEB" >/dev/null && curl -fsSL "$URL_SUMS" -o SHA256SUMS; then
              CHECKSUM="$(awk -v asset="$ASSET_NAME" '$2 == asset || $2 == "./" asset { print $1 }' SHA256SUMS)"
              if [[ "$CHECKSUM" =~ ^[0-9a-fA-F]{64}$ ]] && [ "$(printf '%s\n' "$CHECKSUM" | wc -l)" -eq 1 ]; then
                sed -i "s/__SHA256__/${CHECKSUM}/" aur-tinybubbles-bin-beta/PKGBUILD
                echo "Resolved the exact release-manifest checksum for ${ASSET_NAME}."
                exit 0
              fi
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "Release asset or exact checksum not available after waiting: $ASSET_NAME" >&2
              exit 1
            fi
            echo "Release asset or checksum not available yet (attempt ${attempt}/10); retrying..." >&2
            sleep 15
          done

      - name: Update .SRCINFO and smoke package
        shell: bash
        run: |
          set -euo pipefail
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            -v "$PWD/aur-tinybubbles-bin-beta:/aur" \
            -w /aur \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman -Sy --noconfirm --needed base-devel git pacman-contrib
              getent group "$HOST_GID" >/dev/null 2>&1 || groupadd -g "$HOST_GID" builder
              id -u builder >/dev/null 2>&1 || useradd -m -u "$HOST_UID" -g "$HOST_GID" builder
              chown -R builder:builder /aur
              su builder -c "makepkg --verifysource --noconfirm"
              su builder -c "makepkg --cleanbuild --clean --nodeps --noconfirm"
              su builder -c "makepkg --printsrcinfo > /aur/.SRCINFO"
            '

      - name: Prepare immutable AUR proposal
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci/prepare-aur-proposal.sh \
            aur-tinybubbles-bin-beta \
            tinybubbles-bin-beta \
            "${{ steps.version.outputs.tag }}" \
            aur-proposal

      - name: Preserve exact AUR proposal for reviewed publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aur-proposal-tinybubbles-bin-beta-${{ steps.version.outputs.tag }}
          path: aur-proposal/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
