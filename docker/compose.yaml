services:
  tinybubbles-cloud:
    image: ghcr.io/tinybubbles-app/tinybubbles-cloud:latest
    build:
      context: ..
      dockerfile: docker/cloud/Dockerfile
    container_name: tinybubbles-cloud
    hostname: tinybubbles-cloud
    restart: always
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/health >/dev/null || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - 8787:8787
    environment:
      - TINYBUBBLES_CLOUD_AUTH_TOKENS=${TINYBUBBLES_CLOUD_AUTH_TOKENS:?TINYBUBBLES_CLOUD_AUTH_TOKENS must be set}
      - TINYBUBBLES_CLOUD_CORS_ORIGIN=${TINYBUBBLES_CLOUD_CORS_ORIGIN:?TINYBUBBLES_CLOUD_CORS_ORIGIN must be set}
    volumes:
      - ./data:/app/cloud_data

  tinybubbles-app:
    image: ghcr.io/tinybubbles-app/tinybubbles-app:latest
    build:
      context: ..
      dockerfile: docker/app/Dockerfile
    container_name: tinybubbles-app
    hostname: tinybubbles-app
    restart: always
    cpus: "1.0"
    mem_limit: 512m
    depends_on:
      tinybubbles-cloud:
        condition: service_healthy
    ports:
      - 5173:5173
