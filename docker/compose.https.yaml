services:
  tinybubbles-cloud:
    image: ghcr.io/Ameyakashid/tinybubbles-cloud:latest
    build:
      context: ..
      dockerfile: docker/cloud/Dockerfile
    container_name: tinybubbles-cloud
    hostname: tinybubbles-cloud
    restart: always
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8787/health >/dev/null || exit 1"]
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
    expose:
      - "8787"
    environment:
      - TINYBUBBLES_CLOUD_AUTH_TOKENS=${TINYBUBBLES_CLOUD_AUTH_TOKENS:?TINYBUBBLES_CLOUD_AUTH_TOKENS must be set}
      - TINYBUBBLES_CLOUD_CORS_ORIGIN=${TINYBUBBLES_CLOUD_CORS_ORIGIN:?TINYBUBBLES_CLOUD_CORS_ORIGIN must be set}
      - TINYBUBBLES_CLOUD_MAX_BODY_BYTES=${TINYBUBBLES_CLOUD_MAX_BODY_BYTES:-2000000}
      - TINYBUBBLES_CLOUD_MAX_ATTACHMENT_BYTES=${TINYBUBBLES_CLOUD_MAX_ATTACHMENT_BYTES:-50000000}
    volumes:
      - ./data:/app/cloud_data

  caddy:
    image: caddy:2-alpine
    container_name: tinybubbles-caddy
    hostname: tinybubbles-caddy
    restart: always
    cpus: "0.5"
    mem_limit: 256m
    depends_on:
      tinybubbles-cloud:
        condition: service_healthy
    ports:
      - "${TINYBUBBLES_HTTP_PORT:-80}:80"
      - "${TINYBUBBLES_HTTPS_PORT:-443}:443"
      - "${TINYBUBBLES_HTTPS_PORT:-443}:443/udp"
    environment:
      - TINYBUBBLES_CLOUD_DOMAIN=${TINYBUBBLES_CLOUD_DOMAIN:?TINYBUBBLES_CLOUD_DOMAIN must be set}
    volumes:
      - ./${TINYBUBBLES_CADDYFILE:-Caddyfile.https}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
